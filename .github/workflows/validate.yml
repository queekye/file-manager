name: Validate Windows source package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      FILE_MANAGER_DISABLE_HOTKEYS: "1"
      FILE_MANAGER_HOME: ${{ github.workspace }}/.validation-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-windows-py312.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest
      - run: python -m src.main --help
      - run: python -m src.main --smoke-test
      - run: python -m build --wheel --sdist
